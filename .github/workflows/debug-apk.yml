name: Debug APK

on:
  push:
    branches: [feature/fast-propfind-listing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            sdk="$RUNNER_TEMP/android-sdk"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$RUNNER_TEMP/cmdline-tools.zip"
            mkdir -p "$sdk/cmdline-tools"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1
          status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            tail -100 "$RUNNER_TEMP/sdk-licenses.log" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;34.0.0' 2>&1 | tee "$RUNNER_TEMP/sdk-install.log"

      - name: Build debug APK (keep WebDavPerf logging)
        run: gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/webdav-fast-propfind-debug.apk
          cp docs/vivo-performance-retest.md artifacts/
          git rev-parse HEAD > artifacts/COMMIT.txt
          cd artifacts
          sha256sum webdav-fast-propfind-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: webdav-fast-propfind-debug-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
